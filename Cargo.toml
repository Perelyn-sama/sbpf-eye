[package]
name = "sbpf-eye"
version = "0.1.0"
edition = "2024"
description = "A CLI for inspecting Solana sBPF binaries and comparing compiler output"
license = "MIT"
repository = "https://github.com/Perelyn-sama/sbpf-eye"
keywords = ["solana", "sbpf", "compiler", "binary", "analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.103"
crossterm = "0.28"
ratatui = "0.29"
sbpf-common = "0.3.2"
sbpf-disassembler = "0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"

toml = "0.8"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
