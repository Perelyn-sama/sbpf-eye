[package]
name = "sbpf-eye-web-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
sbpf-eye = { path = "../.." }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Keep the same decoder version as sbpf-eye; do not silently change CLI semantics.
sbpf-disassembler = "=0.1.9"
sbpf-common = "=0.1.9"
object = "0.38.1"
